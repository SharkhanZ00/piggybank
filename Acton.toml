[package]
name = "Shakhan's piggy bank"
description = "A piggybank pet project"
version = "0.0.1"
license = "MIT"

[toolchain]
acton = "1.2.1"

[contracts.Piggybank]
display-name = "Piggybank"
src = "contracts/Piggybank.tolk"
depends = []

[test]

[fmt]
width = 100
ignore = []

[scripts]
deploy-emulation = "acton script scripts/deploy.tolk"
deploy-testnet = "acton script scripts/deploy.tolk --net testnet"

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"

# Check full Acton.toml reference and all available keys:
# https://ton-blockchain.github.io/acton/docs/acton-toml
